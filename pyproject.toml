[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policypulse-rag"
version = "0.1.0"
description = "A grounded Q&A agent over five policy and specification documents, on Google ADK and Vertex AI RAG Engine."
requires-python = ">=3.11,<3.14"
dependencies = [
  "google-adk[gcp]==2.14.1",
  "google-cloud-agentplatform==2.10.0",
  "pypdf>=5",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
  "google-adk[eval]==2.14.1",
  "google-cloud-aiplatform[evaluation]==2.10.0",
  "pytest>=9,<10",
  "pytest-asyncio>=0.25",
  "pytest-randomly",
  "hypothesis>=6",
  "ruff",
]

[tool.setuptools]
packages = ["policypulse_rag"]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
markers = ["live: needs ADC and a populated corpus; never runs in CI"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
